services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: toko-madura-app
    volumes:
      - .:/var/www
    networks:
      - toko-madura

  nginx:
    image: nginx:alpine
    container_name: toko-madura-nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - toko-madura

networks:
  toko-madura:
    driver: bridge